<div class="widget-row-head">
  <h3 class="widget-title">Calculadora Impuestos</h3>
  <span class="icon-bubble green small"><i class="fa-solid fa-calculator"></i></span>
</div>

<div class="calc-body">
  <div class="calc-form">
    <div class="calc-tabs" role="tablist">
      <button type="button" role="tab" [class.active]="ivaPersona() === 'moral'" [attr.aria-selected]="ivaPersona() === 'moral'" (click)="setIvaPersona('moral')">Moral</button>
      <button type="button" role="tab" [class.active]="ivaPersona() === 'fisica'" [attr.aria-selected]="ivaPersona() === 'fisica'" (click)="setIvaPersona('fisica')">Física</button>
    </div>

    <label class="iva-label" for="ivaMonto">{{ ivaMontoLabel() }}</label>
    <input id="ivaMonto" type="number" min="0" step="0.01" placeholder="0.00" class="iva-input" (input)="onIvaMonto($event)">

    @if (ivaPersona() === 'fisica') {
      <label class="iva-toggle">
        <input type="checkbox" [checked]="ivaIncluido()" (change)="onIvaIncluido($event)">
        <span>El monto ya incluye IVA</span>
      </label>
    } @else {
      <label class="iva-toggle">
        <input type="checkbox" [checked]="retencionesIncluidas()" (change)="onRetencionesIncluidas($event)">
        <span>IVA y retenciones incluidas</span>
      </label>
    }
  </div>

  <dl class="iva-result">
    @for (row of ivaResultado().rows; track row.label) {
      <div [class.iva-resta]="row.resta">
        <dt>{{ row.label }}</dt>
        <dd>{{ row.resta ? '−' : '' }}{{ row.value }}</dd>
      </div>
    }
    <div class="iva-total"><dt>Total</dt><dd>{{ ivaResultado().total }}</dd></div>
  </dl>
</div>
