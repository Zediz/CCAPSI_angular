<div class="login-container">
  <div class="login-header">
    <div class="navbar-brand" style="justify-content: center; margin-bottom: 2rem; pointer-events: none;">
      <img src="assets/images/logo/logo_h.png" alt="CCAPSI" height="42">
      <div class="brand-text">CCAP<span>SI</span></div>
    </div>
    <h1 class="login-title">Bienvenido</h1>
    <p class="login-subtitle">Ingresa a tu cuenta para continuar</p>
  </div>

  <form id="loginForm" method="post" autocomplete="on" (submit)="handleLogin($event)">
    <div class="form-group">
      <label for="email" class="form-label">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username" class="form-control" placeholder="tu@correo.com" required
             [value]="email()" (input)="email.set($any($event.target).value)">
    </div>
    <div class="form-group">
      <label for="password" class="form-label">Contraseña</label>
      <div style="position: relative;">
        <input [type]="showPassword() ? 'text' : 'password'" id="password" name="password" autocomplete="current-password" class="form-control" style="padding-right: 44px;" placeholder="Contraseña" required
               [value]="password()" (input)="password.set($any($event.target).value)">
        <button type="button" class="btn-toggle-password" title="Mostrar/Ocultar contraseña" (click)="showPassword.set(!showPassword())">
          <i class="fa-regular" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()" id="togglePasswordIcon"></i>
        </button>
      </div>
    </div>

    <div class="form-group" style="margin-top: -0.5rem; text-align: left;">
      <label style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); font-size: 0.85rem; cursor: pointer;">
        <input type="checkbox" id="rememberMe" style="accent-color: var(--primary); cursor: pointer; width: 16px; height: 16px;"
               [checked]="rememberMe()" (change)="rememberMe.set($any($event.target).checked)">
        <span>Recordar mis datos</span>
      </label>
    </div>

    <button type="submit" class="btn-login" id="btnSubmit" [disabled]="loading()">
      @if (loading()) {
        <i class="fa-solid fa-circle-notch fa-spin"></i><span>Iniciando...</span>
      } @else {
        <span>Iniciar sesión</span>
        <i class="fa-solid fa-arrow-right"></i>
      }
    </button>
  </form>
</div>
